name: vue-skills-ci
description: Check a Vue or Nuxt project for upgrade traps, toolchain mismatches, SSR state leaks and exposed secrets
author: Jinwoo Kim
branding:
  icon: check-circle
  color: green

inputs:
  rules:
    description: Groups or rule ids to run, comma separated (toolchain, testing, vapor, vue, nuxt, security). Default all
    default: all
  skip-rules:
    description: Groups or rule ids to leave out, comma separated
    default: ''
  path:
    description: Directory to check, relative to the repository root
    default: .
  fail-on:
    description: Lowest severity that fails the step (error, warn, info or never)
    default: error
  baseline:
    description: Baseline file of known findings to ignore (create it with --update-baseline)
    default: ''
  sarif:
    description: Also write a SARIF report to this path, for github/codeql-action/upload-sarif
    default: ''

runs:
  using: composite
  steps:
    - name: Check Vue rules
      shell: bash
      env:
        CHECK_PATH: ${{ inputs.path }}
        FAIL_ON: ${{ inputs.fail-on }}
        BASELINE: ${{ inputs.baseline }}
        SARIF: ${{ inputs.sarif }}
        RULES: ${{ inputs.rules }}
        SKIP_RULES: ${{ inputs.skip-rules }}
      run: |
        args=(check "$CHECK_PATH" --format github --fail-on "$FAIL_ON")
        if [ -n "$RULES" ] && [ "$RULES" != "all" ]; then args+=(--rules "$RULES"); fi
        if [ -n "$SKIP_RULES" ]; then args+=(--skip-rules "$SKIP_RULES"); fi
        if [ -n "$BASELINE" ]; then args+=(--baseline "$BASELINE"); fi
        if [ -n "$SARIF" ]; then args+=(--sarif "$SARIF"); fi
        node "$GITHUB_ACTION_PATH/src/cli.mjs" "${args[@]}"
